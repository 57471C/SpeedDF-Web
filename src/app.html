<!DOCTYPE html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>speedDF - Local PDF editor. Open, mark up, save.</title>

		<!-- Favicons -->
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon-16x16.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&family=Varela+Round&display=swap" rel="stylesheet" />

		<!-- Primary SEO -->
		<meta name="description" content="Local desktop PDF editor. No cloud, no accounts, no waiting. Open, annotate, sign, and reorganize PDFs on your machine." />

		<!-- Open Graph -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://speeddf.com/" />
		<meta property="og:title" content="speedDF – Local PDF editor" />
		<meta property="og:description" content="Open a PDF. Mark it up. Save. Done. No cloud, no accounts, no waiting." />
		<meta property="og:image" content="https://speeddf.com/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:site_name" content="speedDF" />

		<!-- Twitter -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="speedDF – Local PDF editor" />
		<meta name="twitter:description" content="Open a PDF. Mark it up. Save. Done. No cloud, no accounts, no waiting." />
		<meta name="twitter:image" content="https://speeddf.com/og.png" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-[#080e1c] text-white antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
